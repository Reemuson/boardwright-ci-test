# KiBot output for generating Gerber files
# https://kibot.readthedocs.io/en/latest/configuration/outputs/gerber.html

kibot:
  version: 1

outputs:
- name: @NAME@
  comment: '@COMMENT@'
  type: gerber
  category: '@DIR@'
  dir: '@DIR@'
  layers: ['copper', 'Edge.Cuts', 'F.Silkscreen', 'F.Mask', 'F.Paste', 'B.Silkscreen', 'B.Mask', 'B.Paste']
  options:
    subtract_mask_from_silk: true
    plot_footprint_refs: @PLOT_REFS@
    # Values must be plotted: KiCad also drops footprint user text that is
    # exactly ${VALUE} (e.g. test-point net labels) when this is false. Hidden
    # and Fab-layer values are never plotted. Guarded by validate and by
    # python -m boardwright.silkscreen in CI.
    plot_footprint_values: @PLOT_VALUES@
    create_gerber_job_file: false

...
definitions:
  NAME: gbr_gerbers
  COMMENT: Gerbers in GBR format
  DIR: Manufacturing/Fabrication/Gerbers
  PLOT_REFS: true
  PLOT_VALUES: true