name: Boardwright Prepare Release Tag
run-name: Prepare ${{ inputs.version }} (${{ inputs.variant }}, ${{ inputs.release_kind }})

on:
  workflow_dispatch:
    inputs:
      version:
        description: Semantic version to release
        required: true
        type: string
      variant:
        description: KiBot variant to accept and tag
        required: true
        default: CHECKED
        type: choice
        options:
          - DRAFT
          - PRELIMINARY
          - CHECKED
          - RELEASED
      release_kind:
        description: GitHub Release state for the tag workflow
        required: true
        default: prerelease
        type: choice
        options:
          - draft
          - prerelease
          - release
      drawing_revision:
        description: Controlled drawing revision for the revision table
        required: true
        type: string
      revision_description:
        description: Revision table description, 60 characters or fewer
        required: true
        type: string
      change_classes:
        description: "Comma-separated change classes: documentation, electrical, fabrication, assembly, tooling (blank only for the first release)"
        required: false
        default: ""
        type: string
      justification:
        description: Why this release is needed (recorded in .boardwright/releases.yaml)
        required: false
        default: ""
        type: string
      source_sha:
        description: Reviewed main commit to release; the run fails if main has moved
        required: false
        default: ""
        type: string
      review_hold:
        description: Build and upload the release candidate for review, then stop before any push or tag
        required: false
        default: false
        type: boolean
      approved_review_run:
        description: Run ID of a successful review_hold run; the release must match that reviewed candidate
        required: false
        default: ""
        type: string

permissions:
  contents: write
  actions: write

concurrency:
  group: boardwright-main
  cancel-in-progress: false

env:
  PYTHONPATH: ${{ github.workspace }}/src
  KICAD_VERSION: "9"
  # Dispatch inputs reach shell steps only through the environment, never
  # through ${{ }} interpolation inside scripts (prevents script injection).
  IN_VERSION: ${{ inputs.version }}
  IN_VARIANT: ${{ inputs.variant }}
  IN_RELEASE_KIND: ${{ inputs.release_kind }}
  IN_DRAWING_REVISION: ${{ inputs.drawing_revision }}
  IN_REVISION_DESCRIPTION: ${{ inputs.revision_description }}
  IN_CHANGE_CLASSES: ${{ inputs.change_classes }}
  IN_JUSTIFICATION: ${{ inputs.justification }}
  IN_SOURCE_SHA: ${{ inputs.source_sha }}
  IN_REVIEW_HOLD: ${{ inputs.review_hold }}
  IN_APPROVED_REVIEW_RUN: ${{ inputs.approved_review_run }}

jobs:
  prepare:
    name: Prepare ${{ inputs.version }} release state
    runs-on: ubuntu-latest
    if: github.ref_type == 'branch' && github.ref_name == 'main'
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          persist-credentials: false
          ref: main
          fetch-depth: 0

      - name: Verify reviewed source and tag availability
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # Checkouts do not persist credentials, so the build container never sees
          # the job token. Authenticate only this step's git commands.
          auth="$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)"
          echo "::add-mask::$auth"
          export GIT_CONFIG_COUNT=1 GIT_CONFIG_KEY_0="http.https://github.com/.extraheader" GIT_CONFIG_VALUE_0="AUTHORIZATION: basic $auth"
          if [[ ! "$IN_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Release version must be semantic (for example 1.0.1): $IN_VERSION" >&2
            exit 1
          fi
          head_sha="$(git rev-parse HEAD)"
          if [[ -n "$IN_SOURCE_SHA" && "$head_sha" != "$IN_SOURCE_SHA"* ]]; then
            echo "main is at $head_sha but the reviewed source is $IN_SOURCE_SHA; refusing to release unreviewed commits." >&2
            exit 1
          fi
          echo "BOARDWRIGHT_SOURCE_SHA=$head_sha" >> "$GITHUB_ENV"
          if [[ "$IN_REVIEW_HOLD" == "true" && -n "$IN_APPROVED_REVIEW_RUN" ]]; then
            echo "review_hold and approved_review_run are mutually exclusive." >&2
            exit 1
          fi
          if [[ -n "$IN_APPROVED_REVIEW_RUN" && ! "$IN_APPROVED_REVIEW_RUN" =~ ^[0-9]+$ ]]; then
            echo "approved_review_run must be a numeric run ID." >&2
            exit 1
          fi
          if git rev-parse --verify --quiet "refs/tags/$IN_VERSION" >/dev/null; then
            echo "Tag already exists: $IN_VERSION" >&2
            exit 1
          fi
          set +e
          git ls-remote --exit-code --tags origin "refs/tags/$IN_VERSION" >/dev/null 2>&1
          status=$?
          set -e
          case "$status" in
            0) echo "Remote tag already exists: $IN_VERSION" >&2; exit 1 ;;
            2) echo "Tag $IN_VERSION is free." ;;
            *) echo "Could not query remote tags (exit $status); refusing to continue." >&2; exit 1 ;;
          esac

      - name: Record job start time
        shell: bash
        run: echo "BOARDWRIGHT_JOB_START_EPOCH=$(date +%s)" >> "$GITHUB_ENV"

      - name: Configure git author
        shell: bash
        run: |
          git config user.name "boardwright[bot]"
          git config user.email "boardwright[bot]@users.noreply.github.com"

      - name: Cache Python packages
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('pyproject.toml') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install Boardwright
        shell: bash
        run: python -m pip install -e .

      - name: Summarize release request
        shell: bash
        run: |
          case "$IN_VARIANT" in
            DRAFT|PRELIMINARY|CHECKED|RELEASED) ;;
            *) echo "Unsupported release variant: $IN_VARIANT" >&2; exit 1 ;;
          esac
          {
            echo "## Boardwright Prepare Release"
            echo
            echo "- Version: \`${IN_VERSION}\`"
            echo "- Variant: \`${IN_VARIANT}\`"
            echo "- Release kind: \`${IN_RELEASE_KIND}\`"
            echo "- Drawing revision: \`${IN_DRAWING_REVISION}\`"
            echo "- Revision description: \`${IN_REVISION_DESCRIPTION}\`"
            echo "- Change classes: \`${IN_CHANGE_CLASSES:-initial}\`"
            echo "- Source commit: \`${BOARDWRIGHT_SOURCE_SHA}\`"
            echo "- Target branch: \`main\`"
            echo "- Release ledger: \`.boardwright/releases.yaml\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Cache 3D models
        uses: actions/cache@v4
        with:
          path: ~/cache_3d
          key: ${{ runner.os }}-kicad-${{ env.KICAD_VERSION }}-3d
          restore-keys: |
            ${{ runner.os }}-kicad-${{ env.KICAD_VERSION }}-3d-

      - name: Build release candidate in the pinned container
        shell: bash
        env:
          BOARDWRIGHT_3D_CACHE: ~/cache_3d
          # Legacy previous releases are verified against their authenticated
          # published package; failure to fetch it fails the run.
          GH_TOKEN: ${{ github.token }}
        run: |
          # Same command as a local rehearsal: python -m boardwright container candidate.
          # It runs, in order: release --prepare (ledger, changelog, release.env),
          # the output build, the accepted manifest, check-baseline (host, needs
          # GH_TOKEN) and the review-candidate record. It never commits, pushes
          # or tags; the steps below do that after the review gate.
          set -o pipefail
          python -m boardwright.container candidate "$IN_VERSION" --workdir . --kicad "$KICAD_VERSION" \
            --variant "$IN_VARIANT" --kind "$IN_RELEASE_KIND" \
            --drawing-revision "$IN_DRAWING_REVISION" \
            --revision-description "$IN_REVISION_DESCRIPTION" \
            --change-class "$IN_CHANGE_CLASSES" \
            --justification "$IN_JUSTIFICATION" | tee boardwright-candidate.log

      - name: Summarize baseline check
        if: always()
        shell: bash
        run: |
          {
            echo "## Release candidate build"
            echo
            echo '```'
            grep -E '^\[candidate\]|baseline|reused|reissued|differ|ERROR|note' boardwright-candidate.log 2>/dev/null || echo "no candidate log"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Summarize build identity
        if: always()
        shell: bash
        run: |
          {
            echo "## Build identity"
            echo
            echo '```json'
            cat boardwright-build/record.json 2>/dev/null || echo '"no build record"'
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload release candidate for review
        if: inputs.review_hold
        uses: actions/upload-artifact@v4
        with:
          name: boardwright-release-candidate-${{ inputs.version }}
          if-no-files-found: error
          include-hidden-files: true
          path: |
            .boardwright/review_candidate.json
            .boardwright/accepted_manifest.json
            .boardwright/releases.yaml
            .boardwright/release.env
            .boardwright/revision_history_variables.env
            .boardwright/document_revisions.yaml
            .boardwright/project.yaml
            CHANGELOG.md
            README.md
            Manufacturing
            Schematic
            Reports

      - name: Stop for review
        if: inputs.review_hold
        shell: bash
        run: |
          {
            echo "## Release candidate held for review"
            echo
            echo "Nothing was committed, pushed or tagged."
            echo "Inspect artifact \`boardwright-release-candidate-${IN_VERSION}\`, then dispatch again with"
            echo "\`approved_review_run=${GITHUB_RUN_ID}\` and identical inputs."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Check approved review run
        if: ${{ !inputs.review_hold && inputs.approved_review_run != '' }}
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          info="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$IN_APPROVED_REVIEW_RUN" --jq '[.path, .conclusion, .event, .head_branch, .head_sha] | @tsv')"
          IFS=$'\t' read -r path conclusion event branch sha <<< "$info"
          [[ "$path" == ".github/workflows/prepare-release.yaml" ]] || { echo "Run $IN_APPROVED_REVIEW_RUN is not a prepare-release run ($path)." >&2; exit 1; }
          [[ "$conclusion" == "success" ]] || { echo "Reviewed run concluded '$conclusion'." >&2; exit 1; }
          [[ "$event" == "workflow_dispatch" && "$branch" == "main" ]] || { echo "Reviewed run was $event on $branch." >&2; exit 1; }
          [[ "$sha" == "$BOARDWRIGHT_SOURCE_SHA" ]] || { echo "Reviewed run built $sha; main is $BOARDWRIGHT_SOURCE_SHA." >&2; exit 1; }

      - name: Download reviewed candidate
        if: ${{ !inputs.review_hold && inputs.approved_review_run != '' }}
        uses: actions/download-artifact@v4
        with:
          name: boardwright-release-candidate-${{ inputs.version }}
          run-id: ${{ inputs.approved_review_run }}
          github-token: ${{ github.token }}
          path: reviewed-candidate

      - name: Verify release matches the reviewed candidate
        if: ${{ !inputs.review_hold && inputs.approved_review_run != '' }}
        shell: bash
        run: |
          set -o pipefail
          python -m boardwright.review_gate verify --candidate reviewed-candidate | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Discard generated source side effects
        shell: bash
        run: |
          # Restores every tracked file the build rewrote and fails if any
          # modification outside the kept paths remains.
          python -m boardwright.ci_cleanup --keep README.md assets/renders CHANGELOG.md .boardwright

      - name: Commit accepted release state
        if: ${{ !inputs.review_hold }}
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # Checkouts do not persist credentials, so the build container never sees
          # the job token. Authenticate only this step's git commands.
          auth="$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)"
          echo "::add-mask::$auth"
          export GIT_CONFIG_COUNT=1 GIT_CONFIG_KEY_0="http.https://github.com/.extraheader" GIT_CONFIG_VALUE_0="AUTHORIZATION: basic $auth"
          version="$IN_VERSION"
          variant="$IN_VARIANT"

          git rm -r --ignore-unmatch HTML KiRI Manufacturing Reports Schematic Testing
          git add CHANGELOG.md .boardwright/project.yaml .boardwright/document_revisions.yaml
          git add -f .boardwright/revision_history_variables.env .boardwright/release.env
          git add -f .boardwright/releases.yaml .boardwright/accepted_manifest.json .boardwright/review_candidate.json
          git add README.md assets/renders/*.png || true

          if git diff --cached --quiet; then
            echo "No release changes to commit." >&2
            exit 1
          fi

          git commit -m "release: prepare ${version} (${variant})" -m "Source: ${BOARDWRIGHT_SOURCE_SHA}"
          # Non-forced push: fails if main moved after checkout.
          git push origin HEAD:main

      - name: Create and push tag
        if: ${{ !inputs.review_hold }}
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # Checkouts do not persist credentials, so the build container never sees
          # the job token. Authenticate only this step's git commands.
          auth="$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)"
          echo "::add-mask::$auth"
          export GIT_CONFIG_COUNT=1 GIT_CONFIG_KEY_0="http.https://github.com/.extraheader" GIT_CONFIG_VALUE_0="AUTHORIZATION: basic $auth"
          version="$IN_VERSION"
          git tag -a "$version" -m "Release $version"
          if ! git push origin "refs/tags/$version"; then
            echo "::error::Release commit $(git rev-parse HEAD) is on main but tag $version was not pushed. Recover: git tag -a $version $(git rev-parse HEAD) -m 'Release $version' && git push origin $version, then dispatch release.yaml on the tag." >&2
            exit 1
          fi

      - name: Dispatch tag release workflow
        if: ${{ !inputs.review_hold }}
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Tags pushed with GITHUB_TOKEN do not trigger workflows, so this
          # dispatch is the single publish trigger. release.yaml is also
          # serialised per tag and refuses to overwrite a published release.
          gh workflow run release.yaml --ref "$IN_VERSION" --repo "$GITHUB_REPOSITORY"

      - name: Upload prepare logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: boardwright-prepare-release-logs
          path: |
            kibot_prepare*.log
            boardwright-candidate.log
            boardwright-build/

      - name: Summarize job timing
        if: always()
        shell: bash
        run: |
          end_epoch="$(date +%s)"
          start_epoch="${BOARDWRIGHT_JOB_START_EPOCH:-$end_epoch}"
          elapsed="$((end_epoch - start_epoch))"
          {
            echo "## CI Timing"
            echo
            echo "- Job elapsed: ${elapsed}s"
            echo "- Cache note: 3D assets are cached with actions/cache@v4 and mounted into the build container."
            echo "- Cache note: pip downloads are cached with actions/cache@v4."
          } >> "$GITHUB_STEP_SUMMARY"
