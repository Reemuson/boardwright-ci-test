# Manual KiCad 9 -> 10 comparison. Builds one commit in both pinned images,
# never commits or publishes, and compares the controlled outputs. A KiCad 10
# build that rewrites tracked source files fails (the build restores them and
# lists them in its log). Use it before switching project CI to KiCad 10.

name: Boardwright KiCad Compatibility
run-name: KiCad 9 vs 10 on ${{ inputs.ref || github.ref_name }}

on:
  workflow_dispatch:
    inputs:
      ref:
        description: Commit, branch or tag to compare (default the dispatched ref)
        required: false
        default: ""
        type: string
      variant:
        description: KiBot variant
        required: true
        default: CHECKED
        type: choice
        options:
          - PRELIMINARY
          - CHECKED
          - RELEASED

permissions:
  contents: read

env:
  PYTHONPATH: ${{ github.workspace }}/src
  IN_VARIANT: ${{ inputs.variant }}

jobs:
  build:
    name: Build with KiCad ${{ matrix.kicad }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        kicad: ["9", "10"]
    env:
      KICAD_VERSION: ${{ matrix.kicad }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          ref: ${{ inputs.ref || github.ref }}
          fetch-depth: 0

      - name: Cache 3D models
        uses: actions/cache@v4
        with:
          path: ~/cache_3d
          key: ${{ runner.os }}-kicad-${{ matrix.kicad }}-3d
          restore-keys: |
            ${{ runner.os }}-kicad-${{ matrix.kicad }}-3d-

      - name: Build outputs in the pinned container
        shell: bash
        env:
          BOARDWRIGHT_3D_CACHE: ~/cache_3d
        run: |
          python -m boardwright.container build --workdir . --kicad "$KICAD_VERSION" \
            --variant "$IN_VARIANT" --log-prefix compat

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: compat-kicad${{ matrix.kicad }}
          path: |
            boardwright-build/
            kibot_compat*.log
            Manufacturing
            Schematic
            Reports

  compare:
    name: Compare KiCad 9 and 10 outputs
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          ref: ${{ inputs.ref || github.ref }}
      - uses: actions/download-artifact@v4
        with:
          path: compat
      - name: Compare controlled outputs
        shell: bash
        run: |
          set -uo pipefail
          {
            echo "## KiCad 9 vs 10"
            echo
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          # Images differ by design, so compare the manifests, not the build records.
          python -m boardwright.output_manifest compare \
            compat/compat-kicad9/boardwright-build/manifest.json \
            compat/compat-kicad10/boardwright-build/manifest.json | tee -a "$GITHUB_STEP_SUMMARY"
          status=${PIPESTATUS[0]}
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          echo "Inspect PDFs, renders and ERC/DRC reports in the compat-kicad9/compat-kicad10 artifacts." >> "$GITHUB_STEP_SUMMARY"
          exit "$status"
