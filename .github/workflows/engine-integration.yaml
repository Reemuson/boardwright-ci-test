#
# Testbench only (not part of the Boardwright template). Exercises the shared
# release engine (release_package, release_commit) without publishing:
# read-only token, no persisted credentials, disposable commit repositories
# with no remote. See ci/engine_integration/check.py.

name: Engine integration (non-publishing)
run-name: Engine integration on ${{ github.sha }}

on:
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: engine-integration
  cancel-in-progress: false

jobs:
  engine:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PYTHONPATH: ${{ github.workspace }}/src
    steps:
      - name: Checkout with tags
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false

      - name: Install Boardwright
        run: python -m pip install -e .

      - name: Download the published 0.1.7 package (publish run artifact)
        uses: actions/download-artifact@v4
        with:
          name: boardwright-release-0.1.7
          run-id: 44653725676
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/published

      - name: Run the integration checks
        shell: bash
        run: |
          set -euo pipefail
          python ci/engine_integration/check.py \
            --published-zip "$RUNNER_TEMP/published/boardwright-0.1.7-release.zip" \
            --body ci/engine_integration/release-body-0.1.7.md \
            --work "$RUNNER_TEMP/engine" \
            --repository "$GITHUB_REPOSITORY" \
            --run-url "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" \
            --out "$RUNNER_TEMP/engine-results.json" | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: engine-integration-results
          path: |
            ${{ runner.temp }}/engine-results.json
            ${{ runner.temp }}/engine/workspace/RELEASE_NOTES.md
            ${{ runner.temp }}/engine/workspace/boardwright-release/MANIFEST.txt
