#
# Testbench only (not part of the Boardwright template). Runs the standalone
# local-release lifecycle with real Docker in disposable repositories and
# release stores, without releasing anything in this repository: no push,
# tag, branch update, GitHub release or package publication. See
# ci/local_release_integration/check.py and Boardwright
# docs/LOCAL_RELEASE_INTEGRATION.md.
#
# Credentials: the read-only token is given only to the two snapshot steps and
# the held-candidate download. The integration step has no token; its
# local-release processes also run with every credential-like variable removed.

name: Local release integration (non-publishing)
run-name: Local release integration on ${{ github.sha }}

on:
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: local-release-integration
  cancel-in-progress: false

jobs:
  local-release:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Checkout with tags
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false

      - name: Install Boardwright and the TUI dependency
        run: python -m pip install -e ".[tui]"

      - name: Snapshot the repository before (read-only)
        env:
          GH_TOKEN: ${{ github.token }}
        run: python ci/local_release_integration/remote_snapshot.py capture "$RUNNER_TEMP/remote-before.json"

      - name: Download the held 0.1.8 candidate (comparison only, never approved)
        uses: actions/download-artifact@v4
        with:
          name: boardwright-release-candidate-0.1.8
          run-id: 44670323650
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/held-0.1.8

      - name: Run the local release integration (no token)
        shell: bash
        run: |
          set -euo pipefail
          git config --global user.name "local-release-integration"
          git config --global user.email "local-release-integration@example.invalid"
          python ci/local_release_integration/check.py \
            --temp "$RUNNER_TEMP/local-release-integration" \
            --held-candidate "$RUNNER_TEMP/held-0.1.8" \
            --out "$RUNNER_TEMP/local-release-integration-results.json" | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Snapshot the repository after and compare (read-only)
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python ci/local_release_integration/remote_snapshot.py capture "$RUNNER_TEMP/remote-after.json"
          python ci/local_release_integration/remote_snapshot.py compare \
            "$RUNNER_TEMP/remote-before.json" "$RUNNER_TEMP/remote-after.json" | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Upload results (no packages)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: local-release-integration-results
          path: |
            ${{ runner.temp }}/local-release-integration-results.json
            ${{ runner.temp }}/remote-before.json
            ${{ runner.temp }}/remote-after.json
            ${{ runner.temp }}/local-release-integration/*.log
