name: Boardwright Publish Release
run-name: Publish ${{ github.ref_name }} release package

on:
  push:
    tags:
      - '[0-9]+.[0-9]+.[0-9]+'
  workflow_dispatch:

permissions:
  contents: write
  actions: read

# A tag push by a person and the prepare-release dispatch can both start this
# workflow; serialise per tag so two runs never publish concurrently.
concurrency:
  group: boardwright-release-${{ github.ref_name }}
  cancel-in-progress: false

env:
  PYTHONPATH: ${{ github.workspace }}/src
  KICAD_VERSION: "9"
  RELEASE_DIR: boardwright-release
  RELEASE_KIND: release
  RELEASE_VARIANT: RELEASED

jobs:
  release:
    name: Publish ${{ github.ref_name }}
    runs-on: ubuntu-latest
    if: github.ref_type == 'tag'
    steps:
      - name: Checkout tag
        uses: actions/checkout@v4
        with:
          persist-credentials: false
          ref: ${{ github.ref }}
          fetch-depth: 0

      - name: Refuse to overwrite a published release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if is_draft="$(gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --json isDraft --jq .isDraft 2>/dev/null)"; then
            if [[ "$is_draft" != "true" ]]; then
              echo "Release $GITHUB_REF_NAME is already published; published releases are immutable." >&2
              exit 1
            fi
            echo "Draft release $GITHUB_REF_NAME exists; it will be updated."
          fi

      - name: Record job start time
        shell: bash
        run: echo "BOARDWRIGHT_JOB_START_EPOCH=$(date +%s)" >> "$GITHUB_ENV"

      - name: Cache 3D models
        uses: actions/cache@v4
        with:
          path: ~/cache_3d
          key: ${{ runner.os }}-kicad-${{ env.KICAD_VERSION }}-3d
          restore-keys: |
            ${{ runner.os }}-kicad-${{ env.KICAD_VERSION }}-3d-

      - name: Load release metadata
        shell: bash
        run: |
          if [[ -f .boardwright/release.env ]]; then
            sed -n 's/^\(RELEASE_KIND\|RELEASE_VARIANT\|RELEASE_INCLUDE_SOURCE_ARCHIVE\)=/export \1=/p' .boardwright/release.env > release_metadata.sh
            source release_metadata.sh
            echo "RELEASE_KIND=${RELEASE_KIND:-release}" >> "$GITHUB_ENV"
            echo "RELEASE_VARIANT=${RELEASE_VARIANT:-RELEASED}" >> "$GITHUB_ENV"
            echo "RELEASE_INCLUDE_SOURCE_ARCHIVE=${RELEASE_INCLUDE_SOURCE_ARCHIVE:-false}" >> "$GITHUB_ENV"
          fi

      - name: Choose KiBot variant and output set
        shell: bash
        run: |
          variant="${RELEASE_VARIANT:-RELEASED}"

          case "$variant" in
            DRAFT|PRELIMINARY|CHECKED|RELEASED) ;;
            *)
              echo "Unsupported release variant: $variant" >&2
              exit 1
              ;;
          esac

          echo "KIBOT_VARIANT=$variant" >> "$GITHUB_ENV"

          {
            echo "## Boardwright Publish Release"
            echo
            echo "- Tag: \`${GITHUB_REF_NAME}\`"
            echo "- Variant: \`${variant}\`"
            echo "- Release kind: \`${RELEASE_KIND:-release}\`"
            echo "- Package artifact: \`boardwright-release-${GITHUB_REF_NAME}\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Install Boardwright
        shell: bash
        run: python -m pip install -e .

      - name: Build release outputs in the pinned container
        shell: bash
        env:
          BOARDWRIGHT_3D_CACHE: ~/cache_3d
        run: |
          # Same command as a local build: python -m boardwright container build.
          # Image, KiBot steps, sheet/logo check, silkscreen check and the
          # source side-effect check are defined in src/boardwright/build.py.
          python -m boardwright.container build --workdir . --kicad "$KICAD_VERSION" \
            --variant "$KIBOT_VARIANT" --log-prefix release

      - name: Summarize build identity
        if: always()
        shell: bash
        run: |
          {
            echo "## Build identity"
            echo
            echo '```json'
            cat boardwright-build/record.json 2>/dev/null || echo '"no build record"'
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Verify outputs match the accepted release state
        shell: bash
        run: |
          set -o pipefail
          if [[ -f .boardwright/accepted_manifest.json ]]; then
            python -m boardwright.output_manifest verify | tee -a "$GITHUB_STEP_SUMMARY"
          else
            echo "::warning::No accepted output manifest in $GITHUB_REF_NAME (release prepared before manifests existed); outputs are not verified against the accepted state." | tee -a "$GITHUB_STEP_SUMMARY"
          fi

      - name: Build curated source archive
        if: env.RELEASE_INCLUDE_SOURCE_ARCHIVE == 'true'
        shell: bash
        run: |
          python -c "import sys; from pathlib import Path; sys.path.insert(0, 'src'); from boardwright.source_package import build_source_package; result = build_source_package(Path('.').resolve(), Path('boardwright-${{ github.ref_name }}-source.zip'), force=True); print(f'wrote {result.path} ({result.file_count} file(s))')"

      - name: Generate GitHub release markdown
        shell: bash
        run: |
          # Shared with local publication: src/boardwright/release_package.py
          # (docs/LOCAL_FIRST.md section 6). Writes RELEASE_NOTES.md and copies
          # the chosen board renders next to it as release assets.
          python -m boardwright.release_package notes --tag "$GITHUB_REF_NAME" \
            --variant "$RELEASE_VARIANT" --repository "$GITHUB_REPOSITORY" \
            --asset-base-url "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/releases/download/${GITHUB_REF_NAME}"

      - name: Collect release assets
        shell: bash
        run: |
          # Copy set, RELEASE_IDENTITY.json, ACCEPTED_OUTPUT_MANIFEST.json,
          # MANIFEST.txt and the zip: src/boardwright/release_package.py.
          python -m boardwright.release_package collect --tag "$GITHUB_REF_NAME" --release-dir "$RELEASE_DIR"

      - name: Upload release package artifact
        uses: actions/upload-artifact@v4
        with:
          name: boardwright-release-${{ github.ref_name }}
          path: boardwright-${{ github.ref_name }}-release.zip

      - name: Upload KiBot logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: boardwright-release-logs
          path: |
            kibot_release*.log
            boardwright-build/

      - name: Summarize job timing
        if: always()
        shell: bash
        run: |
          end_epoch="$(date +%s)"
          start_epoch="${BOARDWRIGHT_JOB_START_EPOCH:-$end_epoch}"
          elapsed="$((end_epoch - start_epoch))"
          {
            echo "## CI Timing"
            echo
            echo "- Job elapsed: ${elapsed}s"
            echo "- Cache note: 3D assets are cached with actions/cache@v4 and mounted into the build container."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          body_path: RELEASE_NOTES.md
          files: |
            boardwright-${{ github.ref_name }}-release.zip
            README.md
            *.png
          draft: ${{ env.RELEASE_KIND == 'draft' }}
          prerelease: ${{ env.RELEASE_KIND == 'prerelease' }}
          generate_release_notes: false
