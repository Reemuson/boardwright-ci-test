name: Boardwright Publish Release
run-name: Publish ${{ github.ref_name }} release package

on:
  push:
    tags:
      - '[0-9]+.[0-9]+.[0-9]+'
  workflow_dispatch:

permissions:
  contents: write
  actions: read

# A tag push by a person and the prepare-release dispatch can both start this
# workflow; serialise per tag so two runs never publish concurrently.
concurrency:
  group: boardwright-release-${{ github.ref_name }}
  cancel-in-progress: false

env:
  PYTHONPATH: ${{ github.workspace }}/src
  KICAD_VERSION: "9"
  RELEASE_DIR: boardwright-release
  RELEASE_KIND: release
  RELEASE_VARIANT: RELEASED

jobs:
  release:
    name: Publish ${{ github.ref_name }}
    runs-on: ubuntu-latest
    if: github.ref_type == 'tag'
    steps:
      - name: Checkout tag
        uses: actions/checkout@v4
        with:
          persist-credentials: false
          ref: ${{ github.ref }}
          fetch-depth: 0

      - name: Refuse to overwrite a published release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if is_draft="$(gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --json isDraft --jq .isDraft 2>/dev/null)"; then
            if [[ "$is_draft" != "true" ]]; then
              echo "Release $GITHUB_REF_NAME is already published; published releases are immutable." >&2
              exit 1
            fi
            echo "Draft release $GITHUB_REF_NAME exists; it will be updated."
          fi

      - name: Record job start time
        shell: bash
        run: echo "BOARDWRIGHT_JOB_START_EPOCH=$(date +%s)" >> "$GITHUB_ENV"

      - name: Cache 3D models
        uses: actions/cache@v4
        with:
          path: ~/cache_3d
          key: ${{ runner.os }}-kicad-${{ env.KICAD_VERSION }}-3d
          restore-keys: |
            ${{ runner.os }}-kicad-${{ env.KICAD_VERSION }}-3d-

      - name: Load release metadata
        shell: bash
        run: |
          if [[ -f .boardwright/release.env ]]; then
            sed -n 's/^\(RELEASE_KIND\|RELEASE_VARIANT\|RELEASE_INCLUDE_SOURCE_ARCHIVE\)=/export \1=/p' .boardwright/release.env > release_metadata.sh
            source release_metadata.sh
            echo "RELEASE_KIND=${RELEASE_KIND:-release}" >> "$GITHUB_ENV"
            echo "RELEASE_VARIANT=${RELEASE_VARIANT:-RELEASED}" >> "$GITHUB_ENV"
            echo "RELEASE_INCLUDE_SOURCE_ARCHIVE=${RELEASE_INCLUDE_SOURCE_ARCHIVE:-false}" >> "$GITHUB_ENV"
          fi

      - name: Choose KiBot variant and output set
        shell: bash
        run: |
          variant="${RELEASE_VARIANT:-RELEASED}"

          case "$variant" in
            DRAFT|PRELIMINARY|CHECKED|RELEASED) ;;
            *)
              echo "Unsupported release variant: $variant" >&2
              exit 1
              ;;
          esac

          echo "KIBOT_VARIANT=$variant" >> "$GITHUB_ENV"

          {
            echo "## Boardwright Publish Release"
            echo
            echo "- Tag: \`${GITHUB_REF_NAME}\`"
            echo "- Variant: \`${variant}\`"
            echo "- Release kind: \`${RELEASE_KIND:-release}\`"
            echo "- Package artifact: \`boardwright-release-${GITHUB_REF_NAME}\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Install Boardwright
        shell: bash
        run: python -m pip install -e .

      - name: Build release outputs in the pinned container
        shell: bash
        env:
          BOARDWRIGHT_3D_CACHE: ~/cache_3d
        run: |
          # Same command as a local build: python -m boardwright container build.
          # Image, KiBot steps, sheet/logo check, silkscreen check and the
          # source side-effect check are defined in src/boardwright/build.py.
          python -m boardwright.container build --workdir . --kicad "$KICAD_VERSION" \
            --variant "$KIBOT_VARIANT" --log-prefix release

      - name: Summarize build identity
        if: always()
        shell: bash
        run: |
          {
            echo "## Build identity"
            echo
            echo '```json'
            cat boardwright-build/record.json 2>/dev/null || echo '"no build record"'
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Verify outputs match the accepted release state
        shell: bash
        run: |
          set -o pipefail
          if [[ -f .boardwright/accepted_manifest.json ]]; then
            python -m boardwright.output_manifest verify | tee -a "$GITHUB_STEP_SUMMARY"
          else
            echo "::warning::No accepted output manifest in $GITHUB_REF_NAME (release prepared before manifests existed); outputs are not verified against the accepted state." | tee -a "$GITHUB_STEP_SUMMARY"
          fi

      - name: Build curated source archive
        if: env.RELEASE_INCLUDE_SOURCE_ARCHIVE == 'true'
        shell: bash
        run: |
          python -c "import sys; from pathlib import Path; sys.path.insert(0, 'src'); from boardwright.source_package import build_source_package; result = build_source_package(Path('.').resolve(), Path('boardwright-${{ github.ref_name }}-source.zip'), force=True); print(f'wrote {result.path} ({result.file_count} file(s))')"

      - name: Generate GitHub release markdown
        shell: bash
        run: |
          tag="${GITHUB_REF_NAME}"
          repo="${GITHUB_REPOSITORY}"
          release_url="https://github.com/${repo}/releases/download/${tag}"

          top_image=""
          bottom_image=""
          if [[ -d assets/renders ]]; then
            top_image="$(find assets/renders -maxdepth 1 -type f \( -iname '*angled_top*.png' -o -iname '*top*.png' \) | sort | head -n 1 || true)"
            bottom_image="$(find assets/renders -maxdepth 1 -type f \( -iname '*angled_bottom*.png' -o -iname '*bottom*.png' \) | sort | head -n 1 || true)"
          fi

          {
            echo "Generated \`${RELEASE_VARIANT}\` package for \`${repo}\`."
            echo
            if [[ -n "$top_image" || -n "$bottom_image" ]]; then
              echo "## Board Images"
              echo
              echo '<p align="center">'
              if [[ -n "$top_image" ]]; then
                echo "  <img alt=\"Top board render\" src=\"${release_url}/$(basename "$top_image")\" width=\"45%\">"
              fi
              if [[ -n "$bottom_image" ]]; then
                if [[ -n "$top_image" ]]; then
                  echo '&nbsp; &nbsp; &nbsp; &nbsp;'
                fi
                echo "  <img alt=\"Bottom board render\" src=\"${release_url}/$(basename "$bottom_image")\" width=\"45%\">"
              fi
              echo '</p>'
              echo
            fi
            python - <<'PY'
          import sys
          sys.path.insert(0, "src")
          from pathlib import Path
          from boardwright.release_ledger import load_ledger
          import os
          tag = os.environ["GITHUB_REF_NAME"]
          record = next((r for r in load_ledger(Path(".")) if r.version == tag), None)
          if record is None:
              print("## Identities\n\nNo release ledger entry (legacy release).\n")
          else:
              print("## Identities\n")
              print("| Item | Value |\n|---|---|")
              print(f"| Project release | {record.version} |")
              print(f"| PCB revision | {record.pcb_revision} |")
              print(f"| Schematic revision | {record.schematic_revision} |")
              print(f"| Assembly drawing revision | {record.assembly_revision} |")
              print(f"| Fabrication drawing revision | {record.fabrication_revision} |")
              print(f"| Fabrication baseline | {record.fabrication_baseline.id} ({record.fabrication_baseline.status}) |")
              print(f"| Assembly baseline | {record.assembly_baseline.id} ({record.assembly_baseline.status}) |")
              print(f"| Change classes | {', '.join(record.change_classes) or 'initial'} |")
              print(f"| Source commit | {record.source_commit} |")
              print(f"\n{record.justification}\n")
          PY
            echo "## Changes"
            echo
            awk -v tag="$tag" '
              $0 == "## [" tag "]" || $0 ~ "^## \\[" tag "\\] - " { capture=1; next }
              capture && /^## \[/ { exit }
              capture { print }
            ' CHANGELOG.md
            echo
            echo "## Assets"
            echo
            echo "- Full release package: \`boardwright-${tag}-release.zip\`"
            if [[ -f "boardwright-${tag}-source.zip" ]]; then
              echo "- Curated source package: \`boardwright-${tag}-source.zip\`"
            fi
            echo "- Generated README: included in the release package and generated from \`boardwright_resources/kibot/resources/templates/readme.txt\`"
          } > RELEASE_NOTES.md

          if [[ -n "$top_image" ]]; then
            cp "$top_image" "$(basename "$top_image")"
          fi
          if [[ -n "$bottom_image" ]]; then
            cp "$bottom_image" "$(basename "$bottom_image")"
          fi

      - name: Collect release assets
        shell: bash
        run: |
          rm -rf "$RELEASE_DIR"
          mkdir -p "$RELEASE_DIR"

          for path in Schematic Manufacturing assets HTML KiRI Testing Reports README.md NOTICE.md THIRD_PARTY_NOTICES.md LICENSE boardwright-${{ github.ref_name }}-source.zip; do
            if [[ -e "$path" ]]; then
              cp -a "$path" "$RELEASE_DIR/"
            fi
          done

          if [[ -f .boardwright/releases.yaml ]]; then
            python -c "import json,os,sys; sys.path.insert(0,'src'); from pathlib import Path; from boardwright.release_ledger import load_ledger; r=[x for x in load_ledger(Path('.')) if x.version==os.environ['GITHUB_REF_NAME']]; print(json.dumps(r[0].as_dict(), indent=2) if r else '{}')" > "$RELEASE_DIR/RELEASE_IDENTITY.json"
          fi
          if [[ -f .boardwright/accepted_manifest.json ]]; then
            cp .boardwright/accepted_manifest.json "$RELEASE_DIR/ACCEPTED_OUTPUT_MANIFEST.json"
          fi
          (cd "$RELEASE_DIR" && find . -type f ! -name MANIFEST.txt -print0 | sort -z | xargs -0 sha256sum) > "$RELEASE_DIR/MANIFEST.txt"
          zip -r "boardwright-${{ github.ref_name }}-release.zip" "$RELEASE_DIR"

      - name: Upload release package artifact
        uses: actions/upload-artifact@v4
        with:
          name: boardwright-release-${{ github.ref_name }}
          path: boardwright-${{ github.ref_name }}-release.zip

      - name: Upload KiBot logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: boardwright-release-logs
          path: |
            kibot_release*.log
            boardwright-build/

      - name: Summarize job timing
        if: always()
        shell: bash
        run: |
          end_epoch="$(date +%s)"
          start_epoch="${BOARDWRIGHT_JOB_START_EPOCH:-$end_epoch}"
          elapsed="$((end_epoch - start_epoch))"
          {
            echo "## CI Timing"
            echo
            echo "- Job elapsed: ${elapsed}s"
            echo "- Cache note: 3D assets are cached with actions/cache@v4 and mounted into the build container."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          body_path: RELEASE_NOTES.md
          files: |
            boardwright-${{ github.ref_name }}-release.zip
            README.md
            *.png
          draft: ${{ env.RELEASE_KIND == 'draft' }}
          prerelease: ${{ env.RELEASE_KIND == 'prerelease' }}
          generate_release_notes: false
