#
# Testbench only (not part of the Boardwright template). Exercises local-first
# previews with real Docker in a disposable clone, and rehearses release
# preparation, without publishing: read-only token, no persisted credentials,
# the clone's push URL disabled. See ci/preview_integration/check.py.

name: Preview integration (non-publishing)
run-name: Preview integration on ${{ github.sha }}

on:
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: preview-integration
  cancel-in-progress: false

jobs:
  previews:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout with tags
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false

      - name: Install Boardwright
        run: python -m pip install -e .

      - name: Download the held 0.1.8 candidate (comparison only, never approved)
        uses: actions/download-artifact@v4
        with:
          name: boardwright-release-candidate-0.1.8
          run-id: 44670323650
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/held-0.1.8

      - name: Run the preview integration checks
        shell: bash
        env:
          # Read-only (contents: read, actions: read): used only to read this
          # run's own metadata and artifacts for the approval-boundary check.
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git config --global user.name "preview-integration"
          git config --global user.email "preview-integration@example.invalid"
          python ci/preview_integration/check.py \
            --temp "$RUNNER_TEMP/preview-integration" \
            --held-candidate "$RUNNER_TEMP/held-0.1.8" \
            --out "$RUNNER_TEMP/preview-integration-results.json" | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: preview-integration-results
          path: |
            ${{ runner.temp }}/preview-integration-results.json
            ${{ runner.temp }}/preview-integration/*.log
