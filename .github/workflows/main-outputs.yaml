name: Boardwright Accepted Outputs
run-name: Accept ${{ inputs.variant || 'CHECKED' }} from ${{ inputs.source_label || inputs.source_ref || github.ref_name }} to ${{ inputs.target_branch || 'main' }}

on:
  workflow_dispatch:
    inputs:
      variant:
        description: KiBot variant to generate
        required: false
        default: CHECKED
        type: choice
        options:
          - DRAFT
          - PRELIMINARY
          - CHECKED
          - RELEASED
      commit_outputs:
        description: Commit generated README snapshot back to main
        required: false
        default: false
        type: boolean
      source_ref:
        description: Source branch/ref to generate from
        required: false
        default: dev
        type: string
      source_sha:
        description: Exact reviewed source commit SHA
        required: false
        default: ""
        type: string
      source_label:
        description: Short source label for the run title, such as dev@abc123
        required: false
        default: ""
        type: string
      target_branch:
        description: Branch to receive accepted source and snapshot
        required: false
        default: main
        type: string

permissions:
  contents: write
  actions: read

concurrency:
  group: boardwright-${{ inputs.target_branch || 'main' }}
  cancel-in-progress: false

env:
  # Dispatch inputs reach scripts only via env (prevents script injection).
  IN_COMMIT_OUTPUTS: ${{ inputs.commit_outputs }}
  IN_SOURCE_LABEL: ${{ inputs.source_label }}
  IN_SOURCE_REF_OR_GH_REF_NAME: ${{ inputs.source_ref || github.ref_name }}
  IN_SOURCE_SHA: ${{ inputs.source_sha }}
  IN_TARGET_BRANCH_OR_MAIN: ${{ inputs.target_branch || 'main' }}
  IN_VARIANT: ${{ inputs.variant }}
  IN_VARIANT_OR_CHECKED: ${{ inputs.variant || 'CHECKED' }}
  PYTHONPATH: ${{ github.workspace }}/src
  KIBOT_CONFIG: boardwright_resources/kibot/yaml/kibot_main.yaml
  KIBOT_LOG: kibot_main_outputs.log
  KICAD_VERSION: "9"

jobs:
  outputs:
    name: Accept ${{ inputs.variant || 'CHECKED' }} to ${{ inputs.target_branch || 'main' }}
    runs-on: ubuntu-latest
    if: github.ref_type == 'branch'
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_sha || inputs.source_ref || github.ref_name }}
          fetch-depth: 0

      - name: Record job start time
        shell: bash
        run: echo "BOARDWRIGHT_JOB_START_EPOCH=$(date +%s)" >> "$GITHUB_ENV"

      - name: Verify reviewed source SHA
        if: inputs.source_sha != ''
        shell: bash
        run: |
          actual="$(git rev-parse HEAD)"
          expected="${IN_SOURCE_SHA}"
          if [[ "$actual" != "$expected" ]]; then
            echo "Checked out $actual, expected reviewed source $expected." >&2
            exit 1
          fi

      - name: Summarize accepted output request
        shell: bash
        run: |
          source_sha="$(git rev-parse HEAD)"
          short_sha="$(git rev-parse --short=12 HEAD)"
          commit_url="https://github.com/${GITHUB_REPOSITORY}/commit/${source_sha}"
          source_label="${IN_SOURCE_LABEL}"
          if [[ -z "$source_label" ]]; then
            source_label="${IN_SOURCE_REF_OR_GH_REF_NAME}@${short_sha}"
          fi

          {
            echo "## Boardwright Accept to Main"
            echo
            echo "- Variant: \`${IN_VARIANT_OR_CHECKED}\`"
            echo "- Source: [\`${source_label}\`](${commit_url})"
            echo "- Target branch: \`${IN_TARGET_BRANCH_OR_MAIN}\`"
            echo "- Commit README snapshot: \`${IN_COMMIT_OUTPUTS}\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Choose KiBot variant and output set
        shell: bash
        run: |
          variant="${IN_VARIANT}"
          if [[ -z "$variant" ]]; then
            variant="CHECKED"
          fi

          case "$variant" in
            DRAFT)
              additional_args="--skip-pre draw_fancy_stackup,erc,drc --log $KIBOT_LOG draft_group md_readme"
              ;;
            PRELIMINARY)
              additional_args="--skip-pre erc,drc --log $KIBOT_LOG all_group_k9"
              ;;
            CHECKED|RELEASED)
              additional_args="--log $KIBOT_LOG all_group_k9"
              ;;
            *)
              echo "Unsupported variant for main outputs: $variant" >&2
              exit 1
              ;;
          esac

          echo "KIBOT_VARIANT=$variant" >> "$GITHUB_ENV"
          echo "KIBOT_ADDITIONAL_ARGS=$additional_args" >> "$GITHUB_ENV"

      - name: Ensure 3D cache directory
        run: mkdir -p ~/cache_3d

      - name: Cache 3D models
        uses: actions/cache@v4
        with:
          path: ~/cache_3d
          key: ${{ runner.os }}-kicad-${{ env.KICAD_VERSION }}-3d
          restore-keys: |
            ${{ runner.os }}-kicad-${{ env.KICAD_VERSION }}-3d-

      - name: Install bundled KiCad/PDF fonts
        shell: bash
        run: |
          mkdir -p ~/.local/share/fonts
          cp boardwright_resources/kibot/resources/fonts/*.ttf ~/.local/share/fonts/
          fc-cache -f ~/.local/share/fonts || true

      - name: Generate revision table variables
        if: env.KIBOT_VARIANT != 'DRAFT'
        shell: bash
        run: python -m boardwright revision-history
      - name: Prepare Boardwright PDF table placeholders
        if: env.KIBOT_VARIANT != 'DRAFT'
        shell: bash
        run: python boardwright_resources/kibot/resources/scripts/prepare_pcb_tables.py .

      - name: Generate KiBot PDF table CSV sources
        if: env.KIBOT_VARIANT != 'DRAFT'
        uses: INTI-CMNB/KiBot@v2_dk9
        with:
          additional_args: --skip-pre draw_fancy_stackup,erc,drc --log kibot_main_tables.log table_sources
          variant: ${{ env.KIBOT_VARIANT }}
          config: ${{ env.KIBOT_CONFIG }}
          cache3D: YES

      - name: Prune empty conditional PDF pages
        if: env.KIBOT_VARIANT != 'DRAFT'
        shell: bash
        run: python boardwright_resources/kibot/resources/scripts/prune_pdf_pages.py .

      - name: Normalize project ownership before combined PDF prep
        if: env.KIBOT_VARIANT != 'DRAFT'
        shell: bash
        run: sudo chown -R "$USER:$USER" . 2>/dev/null || true

      - name: Prepare native combined PDF contents
        if: env.KIBOT_VARIANT != 'DRAFT'
        shell: bash
        run: python boardwright_resources/kibot/resources/scripts/prepare_combined_pdf_native.py .

      - name: Generate accepted output package
        uses: INTI-CMNB/KiBot@v2_dk9
        with:
          additional_args: ${{ env.KIBOT_ADDITIONAL_ARGS }}
          variant: ${{ env.KIBOT_VARIANT }}
          config: ${{ env.KIBOT_CONFIG }}
          cache3D: YES

      - name: Regenerate fabrication PDF metadata
        if: env.KIBOT_VARIANT != 'DRAFT'
        uses: INTI-CMNB/KiBot@v2_dk9
        with:
          additional_args: --skip-pre draw_fancy_stackup,erc,drc --log kibot_main_fabrication_document.log pdf_fabrication zip_compress_fab
          variant: ${{ env.KIBOT_VARIANT }}
          config: boardwright_resources/kibot/yaml/kibot_document_fabrication.generated.yaml
          cache3D: YES

      - name: Regenerate assembly PDF metadata
        if: env.KIBOT_VARIANT != 'DRAFT'
        uses: INTI-CMNB/KiBot@v2_dk9
        with:
          additional_args: --skip-pre draw_fancy_stackup,erc,drc --log kibot_main_assembly_document.log pdf_assembly
          variant: ${{ env.KIBOT_VARIANT }}
          config: boardwright_resources/kibot/yaml/kibot_document_assembly.generated.yaml
          cache3D: YES

      - name: Normalize generated output ownership
        shell: bash
        run: sudo chown -R "$USER:$USER" Schematic Manufacturing assets HTML KiRI Testing Reports README.md 2>/dev/null || true
      - name: Install optional PDF combiner dependency
        shell: bash
        run: python -m pip install "pypdf>=4.0"

      - name: Create optional combined review PDF
        shell: bash
        run: python boardwright_resources/kibot/resources/scripts/combine_review_pdf.py .

      - name: Verify silkscreen Gerbers against the board
        shell: bash
        run: |
          # KiBot runs as root in its container; make the reference plot removable.
          sudo chown -R "$USER:$USER" .boardwright-checks 2>/dev/null || true
          set -o pipefail
          python -m boardwright.silkscreen | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Clean generated outputs
        shell: bash
        run: python boardwright_resources/kibot/resources/scripts/clean_generated_outputs.py .

      - name: Discard generated source side effects
        shell: bash
        run: |
          # Restores every tracked file the build rewrote and fails if any
          # modification outside the kept paths remains.
          python -m boardwright.ci_cleanup --keep README.md assets/renders

      - name: Upload accepted outputs artifact
        uses: actions/upload-artifact@v4
        with:
          name: boardwright-main-outputs-${{ env.KIBOT_VARIANT }}
          path: |
            Schematic
            Manufacturing
            assets
            HTML
            KiRI
            Testing
            Reports
            README.md

      - name: Upload KiBot logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: boardwright-main-output-logs
          path: |
            kibot_main*.log

      - name: Summarize job timing
        if: always()
        shell: bash
        run: |
          end_epoch="$(date +%s)"
          start_epoch="${BOARDWRIGHT_JOB_START_EPOCH:-$end_epoch}"
          elapsed="$((end_epoch - start_epoch))"
          {
            echo "## CI Timing"
            echo
            echo "- Job elapsed: ${elapsed}s"
            echo "- Cache note: 3D assets are cached with actions/cache@v4."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Commit accepted outputs
        if: github.event_name == 'workflow_dispatch' && inputs.commit_outputs
        shell: bash
        run: |
          target_branch="${IN_TARGET_BRANCH_OR_MAIN}"
          source_sha="$(git rev-parse HEAD)"
          snapshot_dir="$(mktemp -d)"

          if [[ ! -s README.md ]]; then
            echo "README.md was not generated by KiBot." >&2
            exit 1
          fi

          mkdir -p "$snapshot_dir/assets"
          cp README.md "$snapshot_dir/README.md"
          if [[ -d assets/renders ]]; then
            cp -a assets/renders "$snapshot_dir/assets/renders"
          fi

          git checkout HEAD -- README.md assets/renders 2>/dev/null || true
          git checkout HEAD -- boardwright_resources/kibot/yaml/kibot_main.yaml 2>/dev/null || true
          git clean -f boardwright_resources/kibot/yaml/kibot_document_*.generated.yaml 2>/dev/null || true
          git clean -fd -- HTML KiRI Manufacturing Reports Schematic Testing assets/renders 2>/dev/null || true
          rm -rf HTML KiRI Manufacturing Reports Schematic Testing assets/renders

          git config user.name "boardwright[bot]"
          git config user.email "boardwright[bot]@users.noreply.github.com"

          git fetch origin "$target_branch"
          git switch -C "boardwright-accepted-${target_branch}" "origin/${target_branch}"
          git merge --no-ff --no-edit -X theirs "$source_sha"

          cp "$snapshot_dir/README.md" README.md
          rm -rf assets/renders
          if [[ -d "$snapshot_dir/assets/renders" ]]; then
            mkdir -p assets
            cp -a "$snapshot_dir/assets/renders" assets/renders
          fi

          git rm -r --ignore-unmatch HTML KiRI Manufacturing Reports Schematic Testing
          git add README.md assets/renders/*.png || true

          if git diff --cached --quiet; then
            echo "No README snapshot changes to commit."
            git push origin HEAD:"$target_branch"
            exit 0
          fi

          git commit -m "chore(outputs): update README snapshot"
          git push origin HEAD:"$target_branch"
